name: poc-obs
services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    # Stockage en mémoire plafonné : sans limite, Jaeger a été tué faute de mémoire (OOMKilled)
    # après l'essai dry-sync-01. Au-delà de MEMORY_MAX_TRACES, les plus anciennes sont oubliées.
    environment: [COLLECTOR_OTLP_ENABLED=true, MEMORY_MAX_TRACES=20000]
    mem_limit: 1g
    ports: ["16686:16686"]
    networks: [poc-net]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    command: ["--config=/etc/otel/config.yml"]
    volumes: ["./otel-collector.yml:/etc/otel/config.yml:ro"]
    ports: ["4318:4318"]
    networks: [poc-net]
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    # Arguments par défaut de l'image, plus la réception en remote write : k6 y pousse ses
    # métriques pendant le run (-o experimental-prometheus-rw).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    networks: [poc-net]
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3100:3000"]
    networks: [poc-net]
networks:
  poc-net:
    external: true
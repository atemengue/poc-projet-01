# Projet B : workflow orienté événements (chorégraphie via RabbitMQ).
# Un seul projet actif à la fois (mêmes ports que poc-sync).
name: poc-async

include:
  - ../common/db/postgres.compose.yml

# Réglages communs aux 5 services (règle d'équité : 1 CPU / 512 Mo chacun, comme sync/).
# L'image est construite une seule fois (par payment) puis réutilisée par les autres.
x-service: &service
  image: poc-async-app:local
  pull_policy: never
  init: true
  cpus: 1
  mem_limit: 512m
  networks: [poc-net]
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    interval: 2s
    timeout: 3s
    retries: 30

x-env: &env
  DATABASE_URL: postgres://poc:poc@postgres:5432/poc
  PG_POOL_MAX: "20"
  AMQP_URL: amqp://poc:poc@rabbitmq:5672
  PREFETCH: "64"                 # = OUTBOUND_CONNECTIONS de sync/ (AS6)
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  LOG_LEVEL: info
  # Paramètres d'un run, fixés par run-scenario.js (valeurs par défaut sinon) :
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${TRACE_RATIO:-1.0}            # PC3 : 1.0 par défaut, 0.1 pendant S1 à S4
  IDEMPOTENCY: ${IDEMPOTENCY:-on}                        # K2/K3 (S5) : off pour le témoin
  DUPLICATE_DELIVERY: ${DUPLICATE_DELIVERY:-1}             # K3 (S5) : livraison multiple des événements

services:
  # Broker (AS8). 2 CPU / 1 Go comme PostgreSQL : composant propre au style, compté dans les
  # ressources de async/. Topologie, utilisateur et plugins déclarés par fichiers.
  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
    hostname: rabbitmq
    cpus: 2
    mem_limit: 1g
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-poc.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # interface d'administration (poc / poc)
    networks: [poc-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  order:
    <<: *service
    command: ["node", "--import", "./lib/telemetry.js", "services/order/server.js"]
    environment: { <<: *env, OTEL_SERVICE_NAME: order, PORT: "3000" }
    ports: ["3000:3000"]

  payment:
    <<: *service
    build: .
    command: ["node", "--import", "./lib/telemetry.js", "services/payment/server.js"]
    environment: { <<: *env, OTEL_SERVICE_NAME: payment, PORT: "3001" }
    ports: ["3001:3001"]

  inventory:
    <<: *service
    command: ["node", "--import", "./lib/telemetry.js", "services/inventory/server.js"]
    environment: { <<: *env, OTEL_SERVICE_NAME: inventory, PORT: "3002" }
    ports: ["3002:3002"]

  shipping:
    <<: *service
    command: ["node", "--import", "./lib/telemetry.js", "services/shipping/server.js"]
    environment: { <<: *env, OTEL_SERVICE_NAME: shipping, PORT: "3003" }
    ports: ["3003:3003"]

  notification:
    <<: *service
    command: ["node", "--import", "./lib/telemetry.js", "services/notification/server.js"]
    environment: { <<: *env, OTEL_SERVICE_NAME: notification, PORT: "3004" }
    ports: ["3004:3004"]

# Broker du projet async/ (AS8). Topologie déclarée au démarrage par definitions.json :
# échange topic « orders », une file classique durable par service consommateur,
# échange « orders.dlx » et une file <service>.dlq par service (budget de nouvelles tentatives 0).
load_definitions = /etc/rabbitmq/definitions.json

# Limite mémoire du conteneur (1 Go, AS8) : RabbitMQ calcule son seuil sur cette valeur.
# Au-delà de 40 %, il ralentit les éditeurs (backpressure, à observer en S2 et S4).
total_memory_available_override_value = 1GB
vm_memory_high_watermark.relative = 0.4

# Métriques Prometheus agrégées par file (port 15692, cible déjà déclarée dans prometheus.yml).
prometheus.return_per_object_metrics = true
